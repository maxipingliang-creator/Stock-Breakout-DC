# Copy this file into the PUBLIC data repo (Stock-Breakout-DC) at
# .github/workflows/data-collect.yml
#
# It runs the HEAVY data collection on the public repo's *unlimited* Actions
# minutes, then commits the cached prices + fundamentals back here. It runs NO
# strategy/scanner code: the public repo vendors only the data layer
# (sbs/{config,data,db} + sbs/collect.py) and runs the strategy-free
# `python -m sbs.collect` entrypoint, so the proprietary engine never lands on
# the public runner.
#
# TOKEN-FREE: because the data layer is vendored here, this workflow checks out
# only THIS public repo and pushes the refreshed cache back with the built-in
# GITHUB_TOKEN (granted by `permissions: contents: write`). No PAT into the
# private engine repo is needed. See ../docs/DEPLOYMENT.md.
#
# Required secrets on Stock-Breakout-DC (Settings → Secrets → Actions):
#   ALPACA_API_KEY, ALPACA_SECRET_KEY, ALPACA_BASE_URL
#   SBS_SEC_USER_AGENT   - your contact email (SEC EDGAR requires it)
# (No PRIVATE_REPO_TOKEN — that was only ever needed to read the private engine.)
name: Data Collection

on:
  # Scheduling is external: cron-job.com (America/New_York) dispatches this via
  # workflow_dispatch. No GH `schedule:` cron (UTC-only + unreliable).
  workflow_dispatch:
    inputs:
      provider:
        description: "Data provider"
        type: choice
        default: alpaca
        options: [alpaca, yfinance, stooq]

concurrency:
  group: data-collect
  cancel-in-progress: false

permissions:
  contents: write               # push the refreshed cache back to THIS public repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # full collection ~1-3 min; caps a hung provider fetch
    env:
      PROVIDER: ${{ github.event.inputs.provider || 'alpaca' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      SBS_SEC_USER_AGENT: ${{ secrets.SBS_SEC_USER_AGENT }}
      SBS_MIN_DOLLAR_VOLUME: "1000000"     # relaxed for Alpaca IEX volume
    steps:
      - name: Check out THIS public data repo (carries the vendored data layer + cache)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      # The committed data/cache/ is already in the working tree, so collection
      # extends it incrementally in place (only the missing tail is fetched).
      - name: Collect prices + fundamentals (data layer only; no strategy code here)
        run: python -m sbs.collect --provider "$PROVIDER"

      - name: Commit the refreshed cache (push to self via GITHUB_TOKEN)
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          # -f: the public repo intentionally commits data/cache. This engine's
          # .gitignore ignores it, so force-add in case that rule was vendored.
          git add -f data/cache
          git commit -m "data: refresh $(date -u +%F)" || { echo "no changes to commit"; exit 0; }
          git push
